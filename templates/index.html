<!DOCTYPE html>
<html>
<head>
    <title>Spare Part Recognition</title>
    <style>
        body { font-family: Arial; text-align: center; }
        img { max-width: 500px; margin-top: 20px; }
        .card { border: 1px solid #ccc; padding: 10px; margin: 10px; display: inline-block; width: 300px; }
    </style>
</head>
<body>
    <h2>Spare Part Recognition System</h2>
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="image" accept="image/*" required>
        <br><br>
        <button type="submit">Submit</button>
    </form>
    {% if result_image %}
        <h3>Detection Result</h3>
        <img src="{{ result_image }}">
        <h3>Detected Parts</h3>
        {% for item in detections %}
            <div class="card">
                <h4>{{ item.class }}</h4>
                <p>Confidence: {{ item.confidence }}</p>
            </div>
        {% endfor %}
    {% endif %}
</body>
</html>
